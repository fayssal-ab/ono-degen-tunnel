name: cron-sync

# Hits the protected cron routes on a schedule (prompt §7). Vercel's free tier
# throttles vercel.json crons, so GitHub Actions drives them instead.
# Required repo secrets: SITE_URL (e.g. https://onodegentunnel.com), CRON_SECRET.

permissions:
  contents: read

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min — matches the casino API's 10-min cache
  workflow_dispatch: {}

concurrency:
  group: cron-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skip quietly (no failure e-mails) until the site is deployed and both secrets exist.
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::SITE_URL or CRON_SECRET secret is not set, skipping the cron calls."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! curl -fsS -o /dev/null --connect-timeout 10 --max-time 20 "$SITE_URL"; then
            echo "::warning::$SITE_URL is not reachable, skipping the cron calls."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Sync wagers + leaderboard
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        run: |
          curl -fsS --connect-timeout 10 --max-time 75 -X POST "$SITE_URL/api/cron/sync" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Recompute races
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        run: |
          curl -fsS --connect-timeout 10 --max-time 75 -X POST "$SITE_URL/api/cron/races" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Refresh Kick live status
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        run: |
          curl -fsS --connect-timeout 10 --max-time 75 -X POST "$SITE_URL/api/cron/kick-live" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Slot catalogue + thumbnail checks
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        run: |
          curl -fsS --connect-timeout 10 --max-time 75 -X POST "$SITE_URL/api/cron/slots" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
